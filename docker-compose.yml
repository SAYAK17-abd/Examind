version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: examind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-examind}
      POSTGRES_USER: ${POSTGRES_USER:-examind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-examind_secure_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-examind_user} -d ${POSTGRES_DB:-examind}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - examind-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: examind-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      TESSERACT_CMD: ${TESSERACT_CMD:-tesseract}
      OCR_MAX_IMAGE_DIMENSION: 3000
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8080,http://frontend:80
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - examind-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: examind-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-examind}
      DATABASE_USERNAME: ${POSTGRES_USER:-examind_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-examind_secure_password_2026}
      FLYWAY_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:-c2VjdXJlLWV4YW1pbmQtand0LXNlY3JldC1rZXktZm9yLXByb2R1Y3Rpb24tZGVwbG95bWVudC0yMDI2}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      AI_SERVICE_URL: http://ai-service:8000
      OCR_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_MOCK_MODE: "false"
      OCR_SERVICE_MOCK_MODE: "false"
      UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8080,http://frontend:80
    volumes:
      - file_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - examind-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: examind-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
      - "3000:80"
    networks:
      - examind-network

volumes:
  postgres_data:
  file_uploads:

networks:
  examind-network:
    driver: bridge
