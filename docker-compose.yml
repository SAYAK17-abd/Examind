version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: examind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: examind
      POSTGRES_USER: examind_user
      POSTGRES_PASSWORD: examind_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examind_user -d examind"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - examind-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: examind-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - examind-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: examind-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: examind
      DB_USERNAME: examind_user
      DB_PASSWORD: examind_secure_password_2026
      JWT_SECRET: c2VjdXJlLWV4YW1pbmQtand0LXNlY3JldC1rZXktZm9yLXByb2R1Y3Rpb24tZGVwbG95bWVudC0yMDI2
      JWT_EXPIRATION_MS: 86400000
      JWT_REFRESH_EXPIRATION_MS: 604800000
      AI_SERVICE_URL: http://ai-service:8000
      OCR_SERVICE_URL: http://ai-service:8000
      UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8080
    volumes:
      - file_uploads:/app/uploads
    networks:
      - examind-network

volumes:
  postgres_data:
  file_uploads:

networks:
  examind-network:
    driver: bridge
