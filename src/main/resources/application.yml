server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

spring:
  application:
    name: examind-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

---
# Dev Profile (Default): In-Memory H2 for instantaneous setup & local dev
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:examind_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

---
# Prod Profile: PostgreSQL for production and Docker
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/examind}
    username: ${DATABASE_USERNAME:examind_user}
    password: ${DATABASE_PASSWORD:examind_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

---
# Common App Config
jwt:
  secret: ${JWT_SECRET:examindSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLongForHmacSha256Security!}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:86400000} # 24 hours (configurable)
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days

examind:
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    max-file-size-mb: 10
    allowed-extensions: pdf,jpg,jpeg,png
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-ms: 30000
    mock-mode: ${AI_SERVICE_MOCK_MODE:true}
  ocr-service:
    url: ${OCR_SERVICE_URL:http://localhost:8001}
    timeout-ms: 30000
    mock-mode: ${OCR_SERVICE_MOCK_MODE:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

